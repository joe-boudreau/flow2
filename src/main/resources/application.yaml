ktor:
    development: "$DEVELOPMENT_MODE:false"
    application:
        modules:
            - com.flow2.ApplicationKt.module
    deployment:
        port: "$HTTP_PORT:80"

app:
    schemeDomainPort: "$SCHEME_DOMAIN_PORT:http://localhost"
    adminAuth:
        sessionCookie: "$ADMIN_SESSION_COOKIE:sesh"
        username: "$ADMIN_USERNAME:admin"
        password: "$ADMIN_PASSWORD:password"
        digestSalt: "$DIGEST_SALT:saltnpepper"
    db:
        connectionString: "$DB_CONNECTION_STRING:mongodb://localhost:27017"
        dbName: "$DB_NAME:flow2"

    media:
        directoryPath: "$MEDIA_DIRECTORY_PATH:src/main/resources/media"

    assets:
        directoryPath: "$ASSETS_DIRECTORY_PATH:src/main/resources/assets"

    cloudfront:
        enabled: "$CLOUDFRONT_ENABLED:false"
        distributionId: "$CLOUDFRONT_DISTRIBUTION_ID:"


    comments:
        ownerName: "$COMMENT_OWNER_NAME:flow2"
        smtpHost: "$COMMENT_SMTP_HOST:smtp.protonmail.ch"
        smtpPort: "$COMMENT_SMTP_PORT:587"
        smtpUser: "$COMMENT_SMTP_USER:"
        smtpToken: "$COMMENT_SMTP_TOKEN:"
        sender: "$COMMENT_EMAIL_FROM:notifications@flowtwo.io"
        alertTo: "$COMMENT_ALERT_TO:admin@flowtwo.io"
